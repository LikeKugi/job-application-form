<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#191613">
    <meta name="description" content="Apply to join the Maple Row Block Association crew for street fair season.">
    <title>Job Application Form — Maple Row Block Association</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Public+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="form-header">
            <p class="form-eyebrow">Maple Row Block Association</p>
            <h1>Join the crew</h1>
            <p class="form-lede">Tell us who you are, what you'd like to do, and when you can work. We read every
                application.</p>
        </header>

        <form>
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" placeholder="Ada Marlowe" required>

            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="ada@example.com" required>

            <label for="position">Position</label>
            <select id="position" name="position" required>
                <option value="" selected disabled>Choose a position…</option>
                <option value="Food Stall Lead">Food Stall Lead</option>
                <option value="Stage Crew">Stage Crew</option>
                <option value="Volunteer Coordinator">Volunteer Coordinator</option>
                <option value="Makers' Table Host">Makers' Table Host</option>
                <option value="Site Operations">Site Operations</option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability</legend>
                <div class="radio-options">
                    <div class="radio-option">
                        <input type="radio" id="availability-full-time" name="availability" value="Full-Time" required>
                        <label for="availability-full-time">Full-Time</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="availability-part-time" name="availability" value="Part-Time">
                        <label for="availability-part-time">Part-Time</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="availability-weekends" name="availability" value="Weekends Only">
                        <label for="availability-weekends">Weekends Only</label>
                    </div>
                </div>
            </fieldset>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5"
                placeholder="Why Maple Row? Any experience we should know about?" required></textarea>

            <button type="submit">Submit application</button>

            <p class="form-note">Applications are read by real neighbors — we reply within a week.</p>
        </form>
    </div>
</body>

</html>
